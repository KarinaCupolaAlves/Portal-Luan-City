<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal Luan City | Login</title>

    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" href="assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>

    <!--Header-->

    <div class="header">
        <h1 class="titulo">Portal Luan City</h1>
        <ul class="navbar" id="navbar_ul">

        </ul>
    </div>

    <div class="login">

        <div class="card-login">
            <h2>Olá de volta!</h2>
            <div class="formularioLogin">

                <div class="campoL">
                    <span>E-mail:</span>
                    <input id="email_input" type="text" placeholder="Login ">
                </div>
                <div class="campoL">
                    <span>Senha:</span>
                    <input id="senha_input" type="password" placeholder="******">
                </div>
                <div class="opcaoCadastro">
                    <span>Não tem conta ainda?</span>
                    <a href="cadastro.html">Me cadastrar</a>
                </div>
                <button class="botaoLogin" onclick="entrar()">Entrar</button>
            </div>
        </div>
    </div>

    <!--footer inicio-->
    <footer class="footer">
        <div class="container-footer">
            <p>Portal Luan City</p>
            <div class="creditos">
                <span>Feito com amor por aluna da SPtech</span>
                <span class="version">v1.0.0</span>
            </div>
        </div>
    </footer>

    <!--footer fim-->

</body>

</html>
<script src="./assets/js/navbar.js"></script>
<script>
    alterarNavbar()

    function entrar() {
        let email = email_input.value;
        let senha = senha_input.value;

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senha
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then((json) => {
                    console.log(json);

                    sessionStorage.ID_USUARIO = json[0].id_usuario;
                    sessionStorage.NOME_USUARIO = json[0].nome;
                    sessionStorage.EMAIL_USUARIO = json[0].email;


                    setTimeout(function () {
                        window.location = "./index.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

    }
</script>
