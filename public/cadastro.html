<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Portal Luan City | Cadastro</title>

  <link rel="stylesheet" href="styles/style.css" />
  <link rel="icon" href="assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
  <!--header inicio-->
  <div class="header">
    <h1 class="titulo">Portal Luan City</h1>
    <ul class="navbar" id="navbar_ul">

    </ul>
  </div>
  <!--header fim-->

  <div class="cadastro">

    <div class="card-cadastro">
      <h2>Bem-vindo!</h2>
      <div class="formularioCadastro">

        <div class="campoC">
          <span>Nome:</span>
          <input id="nome_input" type="text" placeholder="Seu nome" />
        </div>
        <div class="campoC">
          <span>E-mail:</span>
          <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
        </div>
        <div class="campoC">
          <span>Senha:</span>
          <input id="senha_input" type="password" placeholder="******" />
        </div>
        <div class="campoC">
          <span>Confirmação da Senha:</span>
          <input id="confirmacao_senha_input" type="password" placeholder="******" />
        </div>
        <div class="campoC">
          <span>Telefone:</span>
          <input id="telefone_input" type="text" placeholder="+xx xxxxxxxxx">
        </div>
        <div class="campoC">
          <span>Data de Nascimento:</span>
          <input id="dt_nasc_input" type="date" placeholder="xx/xx/xxxx">
        </div>
        <button class="botaoCadastro" onclick="cadastrar()">Cadastrar</button>
      </div>

    </div>
  </div>

  <div id="mensagem_erro" class="cardErro"></div>

  <!--footer inicio-->
  <footer class="footer">
    <div class="container-footer">
      <p>Portal Luan City</p>
      <div class="creditos">
        <span>Feito com amor por aluna da SPtech</span>
        <span class="version">v1.0.0</span>
      </div>
    </div>
  </footer>

  <!--footer fim-->
  <script src="./assets/js/navbar.js"></script>
</body>

</html>
<script>
  alterarNavbar()
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeLet = nome_input.value;
    var emailLet = email_input.value;
    var senhaLet = senha_input.value;
    let confirmacaoSenhaLet = confirmacao_senha_input.value;
    let telefoneLet = telefone_input.value;
    let dt_nascLet = dt_nasc_input.value;



    // Verificando se há algum campo em branco
    if (
      nomeLet == "" ||
      emailLet == "" ||
      senhaLet == "" ||
      confirmacaoSenhaLet == "" ||
      telefoneLet == "" ||
      dt_nascLet == ""

    ) {
      mensagem_erro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      // finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    if (senhaLet != confirmacaoSenhaLet) {
      mensagem_erro.style.display = "block";
      mensagem_erro.innerHTML = "As senhas não coincidem!";
      return;
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeLet,
        emailServer: emailLet,
        senhaServer: senhaLet,
        telefoneServer: telefoneLet,
        dt_nascServer: dt_nascLet
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          mensagem_erro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          // finalizarAguardar();
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        // finalizarAguardar();
      });

    return false;
  }

  function sumirMensagem() {
    mensagem_erro.style.display = "none";
  }


</script>
