<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Portal Luan City | Dashboard</title>

    <link rel="stylesheet" href="styles/style.css" />

    <link rel="icon" href="assets/icon/favicon2.ico" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!--header inicio-->
    <div class="header">
        <h1 class="titulo">Portal Luan City</h1>
        <ul class="navbar" id="navbar_ul">

        </ul>
    </div>

    <div class="dashboard">

        <div class="kpis">

            <div class="kpi">
                <h2 id="usuario_musica">ILHA</h2>
                <p>Música que mais combina com você</p>
            </div>

            <div class="kpi">
                <h2 id="usuario_nivel_fa">Super fã</h2>
                <p>Seu nível de fã</p>
            </div>
            <div class="kpi">
                <h2 id="usuario_aproveitamento">80%</h2>
                <p>aproveitamento nos quizzes</p>
            </div>
            <div class="kpi">
                <h2>Romântico</h2>
                <p>Seu estilo dominante</p>
            </div>
        </div>

        <div class="graficosDash">

            <div class="grafico">
                <canvas id="graficoBarra"></canvas>
            </div>
            <div class="grafico">
                <canvas id="graficoDonuts"></canvas>
            </div>
            <div class="grafico">
                <canvas id="graficoRadar"></canvas>
            </div>
            <div class="grafico">
                <canvas id="graficoLinha"></canvas>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container-footer">
            <p>Portal Luan City</p>
            <div class="creditos">
                <span>Feito com amor por aluna da SPtech</span>
                <span class="version">v1.0.0</span>
            </div>
        </div>
    </footer>
    <script src="./assets/js/navbar.js"></script>

</body>

</html>

<script>
    alterarNavbar()

    let idUsuario = sessionStorage.ID_USUARIO;

    window.onload = BuscarDados(idUsuario);

    let graficoBarra;
    let graficoDonuts;
    let graficoRadar;
    let graficoLinha;

    async function BuscarDados(idUsuario) {

        let resultado = await fetch(`/dashboard/BuscarDados/${idUsuario}`)
        let dados = await resultado.json();
        let usuario = dados[0];
    
        carregarGraficos(usuario);
   
}

    function carregarGraficos(usuario) {

        let nomesMusicas = [
            'ILHA',
            'Te Esperando',
            'Ambiente Errado',
            'Mesmo sem estar'
        ];

        let afinidadeUsuario = [
            usuario.ilha,
            usuario.te_esperando,
            usuario.ambiente_errado,
            usuario.mesmo_sem_estar
        ];


        graficoBarra = new Chart(document.getElementById("graficoBarra"), {
            type: 'bar',
            data: {
                labels: nomesMusicas,
                datasets: [{
                    label: 'Compatibilidade musical',
                    data: afinidadeUsuario,
                    backgroundColor: [
                        '#955a97',
                        '#b86cbf',
                        '#d8a5dd',
                        '#7b4a7f'
                    ]
                }]
            }
        });

        let ConhecimentoUser = [
            'Super fã',
            'Fã casual'
        ];

        let porcentagem = ((usuario.quiz1 + usuario.quiz3) / 10) * 100;

        if (porcentagem > 60) {
            usuario_nivel_fa.innerHTML = "Super fã"
        } else {
            usuario_nivel_fa.innerHTML = "Fã comum"
        }
        usuario_aproveitamento.innerHTML = porcentagem + "%"


        graficoDonuts = new Chart(document.getElementById("graficoDonuts"), {
            type: 'bar',
            data: {
                labels: ["Quiz 1", "Quiz 3"],
                datasets: [{
                    label: "Aprovaitamento dos quizzes",
                    data: [(usuario.quiz1 / 5 * 100), (usuario.quiz3 / 5 * 100)],
                    backgroundColor: [
                        '#955a97',
                        '#d8a5dd'
                    ]
                }]
            }
        });

        let Perfilemocional = [
            'Romântico',
            'Animado',
            'Emotivo',
            'Sofredor',
            'Caseiro'
        ];

        let Nivel = [
            usuario.romantico,
            usuario.animado,
            usuario.emotivo,
            usuario.sofredor,
            usuario.caseiro
        ];


        graficoRadar = new Chart(document.getElementById("graficoRadar"), {
            type: 'radar',
            data: {
                labels: Perfilemocional,
                datasets: [{
                    label: 'Seu Perfil',
                    data: Nivel,
                    backgroundColor:
                        'rgba(149,90,151,0.2)',
                    borderColor: '#955a97',     
                    borderWidth: 2
                }]
            }
        });

        let pontuacao = [
            usuario.quiz1,
            usuario.quiz3
        ];
        graficoLinha = new Chart(document.getElementById("graficoLinha"), {
            type: 'bar',
            data: {
                labels: ['Quiz 1', 'Quiz 3'],
                datasets: [{
                    label: 'Pontuação',
                    data: pontuacao,
                    borderColor: '#955a97',
                    tension: 0.3
                }]
            }
        });
        
        let musica_final = "ILHA"
        if (usuario.te_esperando > usuario.ilha) {
            musica_final = "TE ESPERANDO"
        } 
        if (usuario.ambiente_errado > usuario.te_esperando) {
            musica_final = "AMBIENTE ERRADO"
        }
        if (usuario.mesmo_sem_estar > usuario.ambiente_errado) {
            musica_final = "MESMO SEM ESTAR"
        }

        usuario_musica.innerHTML = musica_final;
    }
</script>
