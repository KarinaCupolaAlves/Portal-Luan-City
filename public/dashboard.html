<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Portal Luan City | Dashboard</title>

    <link rel="stylesheet" href="styles/style.css" />

    <link rel="icon" href="assets/icon/favicon2.ico" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!--header inicio-->
    <div class="header">
        <h1 class="titulo">Portal Luan City</h1>
        <ul class="navbar" id="navbar_ul">

        </ul>
    </div>

    <div class="dashboard">

        <div class="kpis">

            <div class="kpi">
                <h2 id="usuario_musica">ILHA</h2>
                <p>Música que mais combina com você</p>
            </div>
            <div class="kpi">
                <h2 id="usuario_aproveitamento">80%</h2>
                <p>Média de acertos nos quizzes</p>
            </div>
            <div class="kpi">
                <h2 id="Nivel">Romântico</h2>
                <p>Seu estilo dominante</p>
            </div>
        </div>

        <div class="graficosDash">

            <div class="graficosDashLinha">

                <div class="grafico">
                    <canvas id="graficoBarra"></canvas>
                </div>
                <div class="grafico">
                    <canvas id="graficoDonuts"></canvas>
                </div>
            </div>

            <div class="graficoDashLinha">
                <div class="grafico-R">
                    <canvas id="graficoRadar"></canvas>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container-footer">
            <p>Portal Luan City</p>
            <div class="creditos">
                <span>Feito com amor por aluna da SPtech</span>
                <span class="version">v1.0.0</span>
            </div>
        </div>
    </footer>
    <script src="./assets/js/navbar.js"></script>

</body>

</html>

<script>
    alterarNavbar()

    let idUsuario = sessionStorage.ID_USUARIO;

    window.onload = BuscarDados(idUsuario);

    let graficoBarra;
    let graficoDonuts;
    let graficoRadar;


    async function BuscarDados(idUsuario) {

        let resultado = await fetch(`/dashboard/BuscarDados/${idUsuario}`)
        let dados = await resultado.json();
        console.log(dados)
        let usuario = dados;
        usuario_aproveitamento.innerHTML = (((usuario.quiz1 + usuario.quiz3) / 10) * 100) + '%'
        
        let estilo = "";

        if (dados.romantico > dados.animado &&
            dados.romantico > dados.emotivo &&
            dados.romantico > dados.sofredor) {

            estilo = "Romântico";

        } else if (dados.animado > dados.emotivo &&
            dados.animado > dados.sofredor) {

            estilo = "Animado";

        } else if (dados.emotivo > dados.sofredor) {

            estilo = "Emotivo";

        } else {

            estilo = "Sofredor";
        }

        Nivel.innerHTML = estilo

        carregarGraficos(usuario);

    }

    function carregarGraficos(usuario) {
        console.log(usuario)

        if (usuario.ilha >
            usuario.te_esperando &&
            usuario.ilha >
            usuario.ambiente_errado &&
            usuario.ilha >
            usuario.mesmo_sem_estar
        ) {
            usuario_musica.innerHTML = `ILHA`;
        } else if (usuario.te_esperando >
            usuario.ilha &&
            usuario.te_esperando >
            usuario.ambiente_errado &&
            usuario.te_esperando >
            usuario.mesmo_sem_estar) {
            usuario_musica.innerHTML = `TE ESPERANDO`;
        } else if (usuario.mesmo_sem_estar >
            usuario.ilha &&
            usuario.mesmo_sem_estar >
            usuario.ambiente_errado &&
            usuario.mesmo_sem_estar >
            usuario.te_esperando) {
            usuario_musica.innerHTML = `MESMO SEM ESTAR`;
        } else if (usuario.ambiente_errado >
            usuario.ilha &&
            usuario.ambiente_errado >
            usuario.mesmo_sem_estar &&
            usuario.ambiente_errado >
            usuario.te_esperando) {
            usuario_musica.innerHTML = `AMBIENTE ERRADO`;
        }


        let nomesMusicas = [
            'ILHA',
            'Te Esperando',
            'Ambiente Errado',
            'Mesmo sem estar'
        ];

        let afinidadeUsuario = [
            usuario.ilha,
            usuario.te_esperando,
            usuario.ambiente_errado,
            usuario.mesmo_sem_estar
        ];


        graficoBarra = new Chart(document.getElementById("graficoBarra"), {
            type: 'bar',
            data: {
                labels: nomesMusicas,
                datasets: [{
                    label: 'Compatibilidade musical',
                    data: afinidadeUsuario,
                    backgroundColor: [
                        '#955a97',
                        '#b86cbf',
                        '#d8a5dd',
                        '#7b4a7f'
                    ]
                }]
            }
        });




        graficoDonuts = new Chart(document.getElementById("graficoDonuts"), {
            type: 'bar',
            data: {
                labels: ["Quiz 1", "Quiz 3"],
                datasets: [{
                    label: "Acertos dos quizzes",
                    data: [(usuario.quiz1 / 5 * 100), (usuario.quiz3 / 5 * 100)],
                    backgroundColor: [
                        '#955a97',
                        '#d8a5dd'
                    ]
                }]
            }
        });

        let Perfilemocional = [
            'Romântico',
            'Animado',
            'Emotivo',
            'Sofredor'
        ];

        let Nivel = [
            usuario.romantico,
            usuario.animado,
            usuario.emotivo,
            usuario.sofredor
        ];
        console.log(Nivel)


        graficoRadar = new Chart(document.getElementById("graficoRadar"), {
            type: 'radar',
            data: {
                labels: Perfilemocional,
                datasets: [{
                    label: 'Seu Perfil',
                    data: Nivel,
                    backgroundColor:
                        'rgba(149,90,151,0.2)',
                    borderColor: '#955a97',
                    borderWidth: 2
                }]
            }
        });

        let pontuacao = [
            usuario.quiz1,
            usuario.quiz3
        ];

    }
</script>
